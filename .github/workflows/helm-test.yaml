name: Lint and Test Charts

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'charts/**'
  workflow_dispatch:
    inputs:
      node_image:
        description: 'kindest/node image for k8s kind cluster'
        default: 'kindest/node:v1.31.9'
        required: false
        type: string
  workflow_call: # Trigger by another workflow
    inputs:
      node_image:
        description: 'kindest/node image for k8s kind cluster'
        default: 'kindest/node:v1.31.9'
        required: false
        type: string

env:
  KINDEST_NODE_VERSION: 'kindest/node:v1.31.9'
  DOCKER_REGISTRY: kind-registry:5000
  IMAGE_NAME: steam-inventory-tracker
  IMAGE_TAG: testing

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kubernetes KinD Cluster
        uses: helm/kind-action@v1
        with:
          node_image: ${{ github.event.inputs.node_image || env.KINDEST_NODE_VERSION }}
          registry: 'true'

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
             echo "::set-output name=changed::true"
          fi

      - name: Run chart-testing (lint)
        run: |
          ct lint --validate-maintainers=false --check-version-increment=false --target-branch ${{ github.event.repository.default_branch }}

      - name: Run chart-testing (install)
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          ct install --charts charts/steam-inventory-tracker --helm-extra-set-args "--set=image.tag=${{ env.IMAGE_TAG }} --set=image.repository=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}"
        if: steps.list-changed.outputs.changed == 'true'