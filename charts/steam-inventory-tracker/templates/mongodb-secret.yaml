apiVersion: v1
kind: Secret
metadata:
  name: {{ include "steam-inventory-tracker.mongodb.secretName" . }}
  labels:
    {{- include "steam-inventory-tracker.labels" . | nindent 4 }}
type: Opaque
data:
  mongodb-root-password: {{ (.Values.mongodb.auth.rootPassword | default (randAlphaNum 32)) | b64enc | quote }}