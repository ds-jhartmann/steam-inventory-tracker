apiVersion: v1
kind: Secret
metadata:
  name: {{ include "steam-inventory-tracker.mongodb.secretName" . }}
  labels:
    {{- include "steam-inventory-tracker.labels" . | nindent 4 }}
type: Opaque
data:
  mongodb-uri: {{ (required "A valid .Values.sit.mongodb.uri entry required!" .Values.sit.mongodb.uri ) | b64enc | quote }}