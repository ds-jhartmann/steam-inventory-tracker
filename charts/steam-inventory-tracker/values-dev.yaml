image:
  tag: sha-${ARGOCD_APP_REVISION_SHORT}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: sit.ouranix.dev
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: tls-sit
      hosts:
        - sit.ouranix.dev
