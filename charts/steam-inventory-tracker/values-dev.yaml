ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: sit.ouranix.dev
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: tls-sit
      hosts:
        - sit.ouranix.dev
